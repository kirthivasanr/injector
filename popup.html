<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Universal Text Injector</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="popup">
    <h1>Universal Text Injector</h1>

    <label for="injectText">Text to inject</label>
    <textarea id="injectText" placeholder="Paste or type text here..."></textarea>

    <button id="startBtn" type="button">Start Injection Mode</button>

    <p id="status" aria-live="polite"></p>
    <p class="hint">Shortcut: Ctrl+Shift+Y (uses last saved text)</p>
  </main>

  <script src="popup.js"></script>
</body>
</html>
